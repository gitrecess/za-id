name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.17.1 is the floor pinned in .nvmrc; 24 catches anything that
        # depends on the current type-stripping behaviour staying experimental.
        node: ['22.17.1', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # `npm test` runs under type stripping, which erases types rather than
      # checking them. This is the only thing that compiles `test/`, and so the
      # only thing that verifies the narrowing the tests claim to assert.
      - run: npm run typecheck

      # The package is worth nothing if the tarball is wrong. Shared with
      # publish.yml so the release path runs the same gate this one does.
      - name: Check tarball contents
        run: node scripts/check-tarball.mjs
