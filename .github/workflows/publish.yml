name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this for a signed
      # attestation linking the published tarball to this commit and workflow.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which is not something you can take back.
      # `github.ref_name` goes through the environment rather than being
      # interpolated into the shell.
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Tag and package version agree: $PKG"

      # Provenance and public access come from publishConfig in package.json.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
